<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanoprotocol: one library imported by ten modules">
  <title>nanoprotocol</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .chip { fill: #F1F5F9; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <g class="txt" font-size="12.5" fill="#334155" text-anchor="middle">
    <rect class="chip" x="96" y="46" width="180" height="36" rx="10"/><text x="186" y="69">nanobus</text>
    <rect class="chip" x="292" y="46" width="180" height="36" rx="10"/><text x="382" y="69">nanogateway</text>
    <rect class="chip" x="488" y="46" width="180" height="36" rx="10"/><text x="578" y="69">nanoagent</text>
    <rect class="chip" x="684" y="46" width="180" height="36" rx="10"/><text x="774" y="69">nanoportal</text>
  </g>

  <g class="wire">
    <line x1="186" y1="82" x2="186" y2="122"/>
    <line x1="382" y1="82" x2="382" y2="122"/>
    <line x1="578" y1="82" x2="578" y2="122"/>
    <line x1="774" y1="82" x2="774" y2="122"/>
    <line x1="186" y1="122" x2="774" y2="122"/>
    <line x1="480" y1="122" x2="480" y2="164"/>
  </g>

  <rect x="320" y="164" width="320" height="88" rx="12" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text class="txt ink" x="480" y="190" font-size="15" font-weight="700" text-anchor="middle">nanoprotocol</text>
  <text class="txt dim" x="480" y="209" font-size="10.5" text-anchor="middle">81 message types · Message envelope · clients</text>
  <text class="txt dim" x="480" y="226" font-size="10.5" text-anchor="middle">WildcardMatch · MediaItem · ConfigItem</text>
  <text class="txt dim" x="480" y="243" font-size="9.5" text-anchor="middle">one dependency: gorilla/websocket</text>

  <g class="wire">
    <line x1="480" y1="252" x2="480" y2="292"/>
    <line x1="186" y1="292" x2="774" y2="292"/>
    <line x1="186" y1="292" x2="186" y2="332"/>
    <line x1="382" y1="292" x2="382" y2="332"/>
    <line x1="578" y1="292" x2="578" y2="332"/>
    <line x1="774" y1="292" x2="774" y2="332"/>
  </g>

  <g class="txt" font-size="12.5" fill="#334155" text-anchor="middle">
    <rect class="chip" x="96" y="332" width="180" height="36" rx="10"/><text x="186" y="355">nanoauth</text>
    <rect class="chip" x="292" y="332" width="180" height="36" rx="10"/><text x="382" y="355">nanoadmin</text>
    <rect class="chip" x="488" y="332" width="180" height="36" rx="10"/><text x="578" y="355">nanoprovisioner</text>
    <rect class="chip" x="684" y="332" width="180" height="36" rx="10"/><text x="774" y="355">nanoui · workspace · artifacts</text>
  </g>

  <text class="txt dim" x="480" y="402" font-size="10.5" text-anchor="middle">a library, not a service: no port, no database — a consumer pins one tag, and a mismatch is caught at build time</text>
</svg>
